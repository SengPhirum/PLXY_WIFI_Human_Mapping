[project]
name = "wifi-mapping"
version = "0.1.0"
description = "Privacy-preserving indoor human localization and movement mapping using Wi-Fi CSI"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyserial>=3.5",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
dev = ["pytest>=8.0", "matplotlib>=3.8", "pyarrow>=15.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wifi_mapping.server" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
